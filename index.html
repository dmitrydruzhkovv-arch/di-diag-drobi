<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дроби: где ты сейчас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a16; --bg2:#12122a;
    --ink:#eef0ff; --muted:#9aa0c8;
    --neon:#a855f7; --neon2:#6366f1; --blue:#3b82f6;
    --ok:#34d399; --bad:#f43f5e; --warn:#818cf8;
    --card:#171733; --line:#2a2a4d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1b1b3d 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;
    min-height:100vh;padding:18px;
  }
  .app{width:100%;max-width:560px;margin:auto}

  /* progress */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px;min-height:24px}
  .bar{flex:1;height:8px;border-radius:8px;background:#1c1c3a;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;width:0;border-radius:8px;
    background:linear-gradient(90deg,var(--neon2),var(--neon));
    box-shadow:0 0 14px var(--neon);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}

  .screen{animation:in .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon);margin-bottom:14px;font-weight:700}
  h1{font-size:30px;line-height:1.15;margin:0 0 14px;font-weight:800}
  .lead{font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 26px}

  .q{font-size:13px;color:var(--muted);margin-bottom:10px}
  .cond{font-size:23px;line-height:1.35;font-weight:700;margin:0 0 22px}

  .fig{display:flex;justify-content:center;margin:0 0 22px}

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    text-align:left;width:100%;cursor:pointer;
    background:var(--card);color:var(--ink);
    border:1.5px solid var(--line);border-radius:16px;
    padding:17px 18px;font-size:18px;font-weight:600;
    display:flex;align-items:center;gap:14px;
    transition:transform .12s ease,border-color .2s,box-shadow .2s,background .2s;
  }
  .opt:active{transform:scale(.985)}
  .opt .key{
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;
    display:grid;place-items:center;font-size:14px;font-weight:800;
    background:#23234a;color:var(--neon);border:1px solid var(--line)
  }
  .opt:not(.locked):hover{border-color:var(--neon2);box-shadow:0 0 0 1px var(--neon2),0 0 22px rgba(99,102,241,.25)}
  .opt.correct{border-color:var(--ok);background:rgba(52,211,153,.12);box-shadow:0 0 26px rgba(52,211,153,.25)}
  .opt.correct .key{background:var(--ok);color:#04231a}
  .opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.10);box-shadow:0 0 26px rgba(244,63,94,.2)}
  .opt.wrong .key{background:var(--bad);color:#2a0410}
  .opt.locked{cursor:default;opacity:.55}
  .opt.locked.correct,.opt.locked.wrong{opacity:1}

  .next{margin-top:22px;display:flex;justify-content:flex-end;min-height:52px}
  .btn{
    border:none;cursor:pointer;font-weight:800;font-size:17px;
    color:#fff;padding:15px 26px;border-radius:14px;
    background:linear-gradient(120deg,var(--neon2),var(--neon));
    box-shadow:0 8px 30px rgba(124,58,237,.45);
    transition:transform .12s,box-shadow .2s,opacity .2s;
  }
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none;color:var(--muted)}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap}
  .hidden{display:none!important}

  /* result */
  .map{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0 24px}
  .theme{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .dot{width:13px;height:13px;border-radius:50%;flex:0 0 13px}
  .dot.ok{background:var(--ok);box-shadow:0 0 12px var(--ok)}
  .dot.warn{background:var(--warn);box-shadow:0 0 12px var(--warn)}
  .dot.gap{background:var(--bad);box-shadow:0 0 12px var(--bad)}
  .theme .nm{font-weight:700;font-size:16px;flex:1}
  .theme .st{font-size:12px;color:var(--muted)}
  .vcard{background:linear-gradient(160deg,#1a1a3a,#141430);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;font-size:17px;line-height:1.5}
  .vcard b{color:var(--neon)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:20px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}

  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;opacity:.7}

  /* объяснялка («живая математика», после ответа) */
  .explain{margin-top:18px;padding:18px 16px 16px;border-radius:18px;
    background:linear-gradient(160deg,#1a1a3a,#141430);border:1px solid var(--line);
    animation:exin .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes exin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .exhead{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon);
    font-weight:800;text-align:center;margin-bottom:12px}
  .exfig{display:flex;justify-content:center;align-items:center;margin-bottom:12px}
  .exfig svg{overflow:visible}
  .exstage{transition:opacity .26s}
  .excmp{gap:26px}
  .excol{display:flex;flex-direction:column;align-items:center;gap:8px}
  .exlbl{text-align:center;font-size:20px;color:var(--ink);margin-bottom:6px;min-height:30px;
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .exf{display:inline-flex;flex-direction:column;align-items:center;line-height:1;
    font-family:"JetBrains Mono",ui-monospace,monospace;vertical-align:middle}
  .exf b{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
  .exf i{width:26px;height:3px;border-radius:3px;margin:3px 0;background:var(--neon2)}
  .exeq,.exval{font-family:"JetBrains Mono",monospace;font-weight:700}
  .exval{color:var(--ok)}
  .exnote{font-size:14px;line-height:1.45;color:var(--muted);text-align:center;margin-top:4px}
  .exsub{font-size:13px;color:var(--muted);text-align:center;margin:-6px 0 8px;display:flex;
    align-items:center;justify-content:center;gap:6px}
  .exreplay{display:block;margin:14px auto 0;background:transparent;border:1.5px solid var(--line);
    color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:9px 18px;
    border-radius:11px;cursor:pointer;transition:border-color .2s,color .2s}
  .exreplay:hover{border-color:var(--neon2);color:var(--ink)}
  .exreplay:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
  <div class="top hidden" id="top">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="count" id="count">0 / 14</div>
  </div>
  <div id="root"></div>
</div>

<script src="app.js"></script>
</body>
</html>
